[metadata]
name = slam-astro
version = file: VERSION
description = Spectral Line Analysis/Modeling for (sub)millimeter astronomy
long_description = file: README.md
long_description_content_type = text/markdown
author = Jinshi Sai, Yusuke Aso
author_email = jinshi.sai@sci.kagoshima-u.ac.jp, yaso@kasi.re.kr
url = https://github.com/jinshisai/SLAM
project_urls =
    Documentation = https://slam-astro.readthedocs.io/
    Source = https://github.com/jinshisai/SLAM
    Issues = https://github.com/jinshisai/SLAM/issues
license = GPL-3.0-only
license_files = LICENSE
classifiers =
    Intended Audience :: Science/Research
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Scientific/Engineering :: Astronomy

[options]
packages = find:
py_modules = utils
python_requires = >=3.12
install_requires =
    astropy>=7.2
    corner
    dynesty
    emcee>=3.1.5
    matplotlib
    numba
    numpy>=2.0
    scipy
    tqdm

[options.packages.find]
where = .
include =
    channelfit
    channelfit.*
    pvanalysis
    pvanalysis.*
    pvfitting
    pvfitting.*
    velgrad
    velgrad.*
