name: Python Package using Conda

on: [push]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      max-parallel: 5

    steps:
    - uses: actions/checkout@v7
    - name: Set up Conda and Python 3.12
      uses: conda-incubator/setup-miniconda@v4
      with:
        miniforge-version: latest
        environment-file: environment.yml
        activate-environment: SLAM
        python-version: '3.12'
        channels: conda-forge
        channel-priority: strict
        auto-activate: false
    - name: Install test dependencies
      run: |
        conda install --yes python=3.12 flake8 pytest
        python --version
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        python -m flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --extend-ignore=E402,E741 --statistics
    - name: Test with pytest
      run: |
        python -m pytest
